<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}USB/IP Client{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">USB/IP Client{% if client_name %} &middot; {{ client_name }}{% endif %}</div>
    {% if request.session.get("user") %}
    <form action="/logout" method="post"><button class="link-btn" type="submit">Log out</button></form>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
