# Deploy on every box that should be able to pull in shared USB devices:
# Proxmox nodes, the Home Assistant VM, etc.
# Run with: docker compose -f docker-compose.client.yml up -d
#
# Why privileged + pid: host + these mounts:
#   - privileged + /lib/modules: lets the container modprobe vhci-hcd into
#     the *host* kernel, and run `usbip attach` with the ioctl access it
#     needs.
#   - /dev, /sys: attaching a device creates real host device nodes; the
#     container needs the same view as the host so other containers
#     (e.g. Home Assistant) or the Proxmox host can see them.
#   - pid: host: required for the Proxmox integration, which runs
#     `qm`/`pvesh` via `nsenter --target 1` into the host's namespaces
#     (the container image doesn't carry Proxmox's cluster filesystem).
#     Not needed if this box is not a Proxmox node - the Proxmox panel
#     just stays hidden.
#   - /var/run/docker.sock: optional. Only needed for the "local Docker
#     containers" panel (e.g. restarting a Home Assistant container after
#     attaching a device). Remove this line on boxes without Docker.
#   - /etc/tmpfiles.d: the client writes one file there (usbip-web.conf)
#     so systemd recreates the stable device nodes /dev/usbip-web/<id> at
#     boot, *before* docker.service starts. Without it, a downstream
#     container whose devices: mapping points at one of those paths fails
#     to start at boot ("error gathering device information ... no such
#     file or directory") because Docker starts it in parallel with this
#     client, before the reattach has happened - and Docker never retries
#     a failed start. Remove on a non-systemd host (the client then just
#     logs a warning).
services:
  usbip-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: usbip-web-client
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    environment:
      WEB_PORT: "8001"
      CLIENT_NAME: "usbip-client"
      HTTPS_ONLY_COOKIE: "0"
    volumes:
      - /dev:/dev
      - /sys:/sys
      - /lib/modules:/lib/modules:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/tmpfiles.d:/etc/tmpfiles.d
      - usbip-client-data:/data

volumes:
  usbip-client-data:
